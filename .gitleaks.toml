title = "Gitleaks Configuration"

[allowlist]
description = "Global allowlist"
# Allow specific files - GitLab paths are relative to repo root
paths = [
  ".env.example",
  "CHANGELOG.md",
]
# Ignore obviously fake/placeholder tokens and credentials
regexes = [
  "branchforge:branchforge",
  "glpat-(example|test|demo|placeholder)",
  "postgresql://branchforge:branchforge@",
  "sk-or-v1-your-key-here",
  "change-this-to-a-random-string",
]

[[rules.allowlist]]
commits = [ "^0000000$" ]
description = "Ignore commits without SHA (e.g., CI scans)"
