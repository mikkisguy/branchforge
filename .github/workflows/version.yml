name: Version Bump

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Fetch all history
        working-directory: ${{ github.workspace }}
        run: |
          git rev-parse --is-inside-work-tree
          git fetch --prune --tags origin
          git checkout main
          git pull --ff-only origin main

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate REPO_TOKEN
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error:: REPO_TOKEN secret is not set or is empty. Please add the REPO_TOKEN secret to your repository settings."
            exit 1
          fi

      - name: Check for changesets and bump version
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "Found $CHANGESET_COUNT changeset files, consuming and bumping versions..."
            pnpm run bump:version
            pnpm --filter @branchforge/shared build
            pnpm typecheck
            pnpm test
            VERSION=$(node -p "require('./package.json').version")
            git add -u
            git commit -m "chore: version packages to v$VERSION"
            git tag "v$VERSION"
            git push https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git main
            git push https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git "v$VERSION"
          else
            echo "No changesets to consume"
          fi
