name: Version Bump

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Fetch all history
        working-directory: ${{ github.workspace }}
        run: |
          git rev-parse --is-inside-work-tree
          git fetch --prune --tags origin
          git checkout main
          git pull --ff-only origin main

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate REPO_TOKEN
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error:: REPO_TOKEN secret is not set or is empty. Please add the REPO_TOKEN secret to your repository settings."
            exit 1
          fi

      - name: Check for changesets and bump version
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "Found $CHANGESET_COUNT changeset files, consuming and bumping versions..."
            pnpm run bump:version
            pnpm --filter @branchforge/shared build
            pnpm typecheck
            pnpm test:unit
            VERSION=$(node -p "require('./package.json').version")
            BRANCH="release/version-v$VERSION"
            PR_TITLE="chore: version packages to v$VERSION [skip-coderabbit]"

            git checkout -B "$BRANCH"
            git add -u
            if git diff --cached --quiet; then
              echo "No changes detected after version bump"
              exit 0
            fi
            git commit -m "chore: version packages to v$VERSION"
            git push --force-with-lease https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git "$BRANCH:$BRANCH"

            PR_BODY=$(printf "%s\n" \
              "<!-- release-automation:version-workflow -->" \
              "## Summary" \
              "- Consume pending changesets and bump package versions to v$VERSION." \
              "- Run build, typecheck, and tests before opening this release PR." \
              "- Merge this PR to trigger version tagging and release workflows." \
              "" \
              "## Notes" \
              "- Generated by .github/workflows/version.yml." \
              "- Title includes [skip-coderabbit] to skip CodeRabbit on this automation PR."
            )

            PR_NUMBER=$(gh pr list \
              --head "$BRANCH" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number')

            if [ -n "$PR_NUMBER" ]; then
              gh pr edit "$PR_NUMBER" --title "$PR_TITLE" --body "$PR_BODY"
            else
              gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "$PR_TITLE" \
                --body "$PR_BODY"
            fi
          else
            echo "No changesets to consume"
          fi
