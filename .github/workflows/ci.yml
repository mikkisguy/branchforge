name: CI for BranchForge

on:
  push:
    branches: [main, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  test-backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @branchforge/shared build

      - name: Run unit tests
        run: pnpm test:unit

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    container: node:20-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: branchforge_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: "postgresql://test_user:test_password@postgres:5432/branchforge_test"
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @branchforge/shared build

      - name: Install drizzle-kit
        run: cd apps/backend && npx -y drizzle-kit

      - name: Run test migrations
        run: cd apps/backend && pnpm db:migrate:test

      - name: Run integration tests
        run: cd apps/backend && pnpm test:integration

  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @branchforge/shared build

      - name: Run frontend tests
        run: cd apps/frontend && pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    container: node:20-alpine
    needs: [test-backend-unit, test-backend-integration, test-frontend-unit]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 7

  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    container: node:20-alpine
    if: github.ref == 'refs/heads/main'
    env:
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: apk add --no-cache git jq

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Fetch all history
        run: |
          git fetch --unshallow || git fetch origin +refs/heads/*:refs/*
          git checkout main
          git branch --set-upstream-to=origin/main main

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate REPO_TOKEN
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error:: REPO_TOKEN secret is not set or is empty. Please add the REPO_TOKEN secret to your repository settings."
            exit 1
          fi

      - name: Check for changesets and bump version
        run: |
          CHANGESET_COUNT=$(ls -1 .changeset/*.md 2>/dev/null | grep -v README.md | wc -l)
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "Found $CHANGESET_COUNT changeset files, consuming and bumping versions..."
            pnpm run bump:version
            VERSION=$(node -p "require('./package.json').version")
            git add .
            git commit -m "chore: version packages to v$VERSION"
            git tag "v$VERSION"
            git push https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git main
            git push https://x-access-token:$REPO_TOKEN@github.com/${{ github.repository }}.git "v$VERSION"
          else
            echo "No changesets to consume"
          fi

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          awk -v version="$VERSION" '/^## v/ {if (p) exit; if ($0 ~ version) p=1} p && !/^## v/ {print}' CHANGELOG.md > release_notes.md || echo "No changelog entry found for v$VERSION"
          echo "exists=$(test -s release_notes.md && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changelog.outputs.exists == 'true'

      - name: Create Release (fallback)
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}. See [CHANGELOG.md](https://github.com/mikkisguy/branchforge/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changelog.outputs.exists != 'true'

  docker-frontend:
    name: Docker Frontend
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '"version"' apps/frontend/package.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/branchforge-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/branchforge-frontend:latest
            ghcr.io/${{ github.repository_owner }}/branchforge-frontend:${{ github.sha }}

  docker-backend:
    name: Docker Backend
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '"version"' apps/backend/package.json | head -1 | cut -d'"' -f4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/branchforge-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/branchforge-backend:latest
            ghcr.io/${{ github.repository_owner }}/branchforge-backend:${{ github.sha }}
