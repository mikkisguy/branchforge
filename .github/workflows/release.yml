name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          awk -v version="$VERSION" '/^## v/ {if (p) exit; if ($0 ~ "^## v" version) p=1} p && !/^## v/ {print}' CHANGELOG.md > release_notes.md || echo "No changelog entry found for v$VERSION"
          echo "exists=$(test -s release_notes.md && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Get git commits for release
        id: commits
        if: steps.changelog.outputs.exists == 'true'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF#refs/tags/}^" 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%h" --reverse)
          else
            COMMITS=$(git log "${PREV_TAG}..${GITHUB_REF#refs/tags/}" --pretty=format:"%h" --reverse)
          fi

          echo "commits=$(printf '%s' "$COMMITS" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Add git hashes to release notes
        if: steps.changelog.outputs.exists == 'true'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}

          if [ -n "${{ steps.commits.outputs.commits }}" ]; then
            IFS=',' read -ra COMMITS <<< "${{ steps.commits.outputs.commits }}"
            COMMIT_INDEX=0
            
            while IFS= read -r line; do
              if [[ $line == \-* ]] && [[ ! $line =~ ^[[:space:]]{2,}- ]]; then
                if [ $COMMIT_INDEX -lt ${#COMMITS[@]} ]; then
                  COMMIT="${COMMITS[$COMMIT_INDEX]}"
                  echo "- ${COMMIT}: ${line#*- }" >> release_notes_with_hashes.md
                  COMMIT_INDEX=$((COMMIT_INDEX + 1))
                else
                  echo "$line" >> release_notes_with_hashes.md
                fi
              else
                echo "$line" >> release_notes_with_hashes.md
              fi
            done < release_notes.md
            mv release_notes_with_hashes.md release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changelog.outputs.exists == 'true'

      - name: Create Release (fallback)
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}. See [CHANGELOG.md](https://github.com/mikkisguy/branchforge/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changelog.outputs.exists != 'true'
