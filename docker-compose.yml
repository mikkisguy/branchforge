services:
  postgres:
    image: postgres:18-alpine
    container_name: branchforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-branchforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-branchforge}
      POSTGRES_DB: ${POSTGRES_DB:-branchforge}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # postgres:18+ image expects the mount at /var/lib/postgresql (data in a versioned subdir)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-branchforge} -d ${POSTGRES_DB:-branchforge}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/mikkisguy/branchforge-backend:${IMAGE_TAG:-beta}
    container_name: branchforge-migrate
    command: ["node", "apps/backend/dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-branchforge}:${POSTGRES_PASSWORD:-branchforge}@postgres:5432/${POSTGRES_DB:-branchforge}
      NODE_ENV: production
      DB_MIGRATION_LOCK_TIMEOUT_MS: ${DB_MIGRATION_LOCK_TIMEOUT_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ghcr.io/mikkisguy/branchforge-backend:${IMAGE_TAG:-beta}
    container_name: branchforge-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-branchforge}:${POSTGRES_PASSWORD:-branchforge}@postgres:5432/${POSTGRES_DB:-branchforge}
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_PATH: ${BASE_PATH:-/api/}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the frontend origin}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      # Host path must already exist and be writable by uid 1001.
      # Compose will not create it: mkdir -p ./uploads && sudo chown 1001:1001 ./uploads
      - type: bind
        source: ./uploads
        target: /app/apps/backend/uploads
        bind:
          create_host_path: false
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const configuredBasePath = process.env.BASE_PATH || ''/api''; const basePath = configuredBasePath.endsWith(''/'') ? configuredBasePath.slice(0, -1) : configuredBasePath; require(''http'').get(''http://localhost:3000'' + basePath + ''/health'', (response) => { process.exit(response.statusCode === 200 ? 0 : 1); }).on(''error'', () => process.exit(1));"',
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    image: ghcr.io/mikkisguy/branchforge-frontend:${IMAGE_TAG:-beta}
    container_name: branchforge-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
